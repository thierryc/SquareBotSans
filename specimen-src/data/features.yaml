  - {tag: SS03, name: Compact r forms, before: 'rare reactor corridor', after: 'rare reactor corridor'}
  - {tag: SS04, name: Code zero + technical I/J, before: 'O0 I1 / JIG / INDEX', after: 'O0 I1 / JIG / INDEX'}
